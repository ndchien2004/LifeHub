<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>LifeHub</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #ffffff;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f8fafc; }
      }
      .brand { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
      .status { font-size: 13px; opacity: 0.7; }
      .bar { width: 190px; height: 3px; border-radius: 2px; background: rgba(127, 127, 127, 0.25); overflow: hidden; }
      .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #6366f1; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div class="brand">LifeHub</div>
    <div class="bar"><i></i></div>
    <div class="status">Đang khởi động dịch vụ nền…</div>
  </body>
</html>
